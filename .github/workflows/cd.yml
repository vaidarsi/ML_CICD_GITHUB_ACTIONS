name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  deploy:
    # Only deploy when CI succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download validated model from CI
        uses: actions/download-artifact@v4
        with:
          name: validated-model
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Check the model file exists
        run: ls -l models/model.joblib

      - name: Compute image name and tag
        run: |
          OWNER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "IMAGE=ghcr.io/${OWNER_REPO}" >> "$GITHUB_ENV"
          echo "TAG=${SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .

      - name: Push image to GHCR
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Deploy container
        run: |
          docker run -d --name wine-api -p 8000:8000 \
            -e MODEL_VERSION="$TAG" "$IMAGE:$TAG"

      - name: Health check (retry up to 60 seconds)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "Health check FAILED"
          exit 1

      - name: Verify /predict
        run: |
          RESPONSE=$(curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features":[14.23,1.71,2.43,15.6,127,2.8,3.06,0.28,2.29,5.64,1.04,3.92,1065]}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"prediction"'
          echo "$RESPONSE" | grep -q "\"model_version\":\"$TAG\""

      - name: Verify /metrics
        run: curl -fsS http://localhost:8000/metrics | grep -E "predictions_total|model_loaded"

      - name: Container logs
        if: always()
        run: docker logs wine-api

      - name: Report result
        run: echo "Deployed $IMAGE:$TAG and verified /health, /predict and /metrics"