name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "data/**"
      - "**.dvc"
      - "dvc.yaml"
      - "params.yaml"
      - "Dockerfile"
      - "requirements*.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "data/**"
      - "**.dvc"
      - "dvc.yaml"
      - "params.yaml"
      - "Dockerfile"
      - "requirements*.txt"
      - ".github/workflows/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check src app tests scripts

      - name: Format check (Black)
        run: black --check src app tests scripts

      - name: Unit tests
        run: python -m pytest -q

      - name: Create dataset
        run: python scripts/create_dataset.py

      - name: Validate data
        run: python -m src.data_validation

      - name: Preprocess data
        run: python -m src.data_preprocessing

      - name: Train model (logs to MLflow)
        run: python -m src.train

      - name: Model validation gate
        run: python -m src.model_validation

      - name: Upload model and reports
        uses: actions/upload-artifact@v4
        with:
          name: validated-model
          path: |
            models/model.joblib
            reports/
            mlruns/

      - name: Docker build check
        run: docker build -t wine-api:ci .